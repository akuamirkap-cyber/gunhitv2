    linear-gradient(180deg, #fff6c8 0%, #ffd56a 20%, #e0a52a 48%, #9a6208 78%, #5a3505 100%);
  animation: bSpin .15s linear infinite;
}
.ps-lite .b3d-tip {
  background: repeating-linear-gradient(180deg, rgba(255,240,220,.32) 0 1.5px, transparent 1.5px 4.5px),
    linear-gradient(180deg, #ffe7cf 0%, #f6a46a 20%, #d4672a 50%, #8a3a12 78%, #4a1a06 100%);
  animation: bSpin .15s linear infinite;
}
@keyframes bSpin { from { background-position: 0 0, 0 0; } to { background-position: 0 9px, 0 0; } }
.ps-lite .b3d-band { background: repeating-linear-gradient(180deg, #5a3505 0 1px, #f0c050 1px 3px); animation: bSpin2 .15s linear infinite; }
@keyframes bSpin2 { from { background-position: 0 0; } to { background-position: 0 6px; } }
.ps-lite .b3d-glint { animation: bGlint .6s linear infinite; }
@keyframes bGlint { 0% { top: -20%; opacity: 0; } 20% { opacity: .95; } 80% { opacity: .95; } 100% { top: 110%; opacity: 0; } }
.ps-lite .st-in-combo { animation-name: stInCombo; animation-timing-function: linear !important; }
@keyframes stInCombo {
  /* ── 1) DROP UP   0 – 1.00 s  (0 – 33.33%) ── */
  0%      { opacity: 0; transform: translateY(170%) rotate(0deg) scale(.8, 1.25); filter: brightness(1); animation-timing-function: cubic-bezier(.2,.8,.3,1); }
  3%      { opacity: 1; }
  20%     { transform: translateY(-14%) rotate(0deg) scale(.94, 1.08); animation-timing-function: ease-in-out; }
  27%     { transform: translateY(4%) rotate(0deg) scale(1.07, .93); animation-timing-function: ease-out; }
  33.33%  { opacity: 1; transform: translateY(0) rotate(0deg) scale(1, 1); filter: brightness(1); animation-timing-function: cubic-bezier(.45,0,.35,1); }
  /* ── 2) VORTEX SPIN ↻ (1 putaran)   1.00 – 1.90 s  (33.33 – 63.33%) ── */
  48%     { transform: translateY(-5%) rotate(180deg) scale(.86, .86); filter: brightness(1.45); animation-timing-function: cubic-bezier(.3,0,.4,1); }
  59%     { transform: translateY(0) rotate(372deg) scale(1.04, 1.04); filter: brightness(1.1); animation-timing-function: ease-out; }
  63.33%  { transform: translateY(0) rotate(360deg) scale(1, 1); filter: brightness(1); animation-timing-function: ease-in; }
  /* ── 3) POP BLAST   1.90 – 3.00 s  (63.33 – 100%) ── */
  70%     { transform: translateY(2%) rotate(360deg) scale(.76, .76); filter: brightness(1.35); animation-timing-function: cubic-bezier(.2,.9,.3,1); }
  78%     { transform: translateY(0) rotate(360deg) scale(1.38, 1.38); filter: brightness(2.6); }
  87%     { transform: translateY(0) rotate(360deg) scale(.9, .9); filter: brightness(1.15); }
  94%     { transform: translateY(0) rotate(360deg) scale(1.05, 1.05); filter: brightness(1); }
  100%    { opacity: 1; transform: translateY(0) rotate(360deg) scale(1, 1); filter: brightness(1); }
}
.ps-lite .st-in-combo::after { content: none !important; animation: none !important; }
.ps-lite .st-out-combo { animation-name: stOutPop; animation-timing-function: ease-in !important; }
.ps-lite .st-pop-in { animation: stPopIn 420ms cubic-bezier(.2,1.3,.4,1) both; }
@keyframes stPopIn { 0% { opacity: 0; transform: translateY(40px) scale(.7); } 100% { opacity: 1; transform: none; } }
.ps-lite .st-in-combo {
  animation-name: comboMove, comboSpin, comboScale, comboFade, comboFlash !important;
  will-change: translate, rotate, scale, opacity, filter;
}
@keyframes comboMove {
  0%     { translate: 0 170%; animation-timing-function: cubic-bezier(.2,.8,.3,1); }
  20%    { translate: 0 -14%; animation-timing-function: ease-in-out; }
  27%    { translate: 0 4%; animation-timing-function: ease-out; }
  33.33% { translate: 0 0; animation-timing-function: ease-in-out; }
  /* the blast happens in place — a tiny lift only, then the weapon settles */
  48%    { translate: 0 -5%; animation-timing-function: ease-in-out; }
  62%    { translate: 0 0; }
  100%   { translate: 0 0; }
}
@keyframes comboSpin {
  0%     { rotate: 0deg; animation-timing-function: cubic-bezier(.42,0,.28,1); }
  33.33% { rotate: 360deg; }
  100%   { rotate: 360deg; }
}
@keyframes comboScale {
  0%     { scale: .8 1.25; animation-timing-function: cubic-bezier(.2,.8,.3,1); }
  20%    { scale: .94 1.08; animation-timing-function: ease-in-out; }
  27%    { scale: 1.07 .93; animation-timing-function: ease-out; }
  33.33% { scale: 1 1; animation-timing-function: cubic-bezier(.5,0,.75,0); }
  /* landed → pop blast immediately (peak 48%) */
  39%    { scale: .76 .76; animation-timing-function: cubic-bezier(.15,.9,.3,1); }
  48%    { scale: 1.38 1.38; animation-timing-function: cubic-bezier(.45,0,.55,1); }
  57%    { scale: .9 .9; animation-timing-function: cubic-bezier(.45,0,.55,1); }
  64%    { scale: 1.05 1.05; animation-timing-function: ease-out; }
  72%    { scale: 1 1; }
  100%   { scale: 1 1; }
}
@keyframes comboFade { 0% { opacity: 0; } 3% { opacity: 1; } 100% { opacity: 1; } }
@keyframes comboFlash {
  0%, 33.33%, 36% { filter: brightness(1); }
  39% { filter: brightness(1.35); animation-timing-function: cubic-bezier(.2,.9,.3,1); }
  48% { filter: brightness(2.6); animation-timing-function: cubic-bezier(.45,0,.55,1); }
  57% { filter: brightness(1.15); animation-timing-function: cubic-bezier(.45,0,.55,1); }
  64%, 100% { filter: brightness(1); }
}

.ps-lite .menu-pop-burst { position: absolute; z-index: 20; width: 0; height: 0; pointer-events: none; }
.ps-lite .menu-pop-ray {
  position: absolute; left: 0; top: -1px; width: 34px; height: 2px; border-radius: 999px;
  transform-origin: 0 50%; opacity: 0;
  background: linear-gradient(90deg, rgba(255,255,255,.95), rgba(255,255,255,.65) 45%, transparent);
  animation: menuPopRay var(--pop-dur, 780ms) cubic-bezier(.1,.7,.3,1) var(--pop-delay, 2820ms) both;
}
@keyframes menuPopRay {
  0% { opacity: 0; transform: rotate(var(--ray-angle)) translateX(4px) scaleX(.2); }
  18% { opacity: .95; transform: rotate(var(--ray-angle)) translateX(12px) scaleX(1); }
  100% { opacity: 0; transform: rotate(var(--ray-angle)) translateX(44px) scaleX(.35); }
}

.ps-lite .st-in-combo::before { content: none !important; animation: none !important; }
.ps-lite .qb-drift { animation: qbDrift 14s linear infinite alternate; }
@keyframes qbDrift { from { translate: -30px 0; } to { translate: 30px 10px; } }
.ps-lite .qb-glint { opacity: 0; animation: qbGlint 2.4s ease-in-out var(--gd, 0s) infinite; box-shadow: 0 0 6px 2px rgba(255,255,255,.8); }
@keyframes qbGlint { 0%, 100% { opacity: 0; transform: scale(.4); } 50% { opacity: .9; transform: scale(1); } }
.ps-lite .qw-caus-a { animation: qwA 9s linear infinite; }
@keyframes qwA { from { background-position: 0 0; } to { background-position: 300px 150px; } }
.ps-lite .qw-caus-b { animation: qwB 13s linear infinite; }
@keyframes qwB { from { background-position: 0 0; } to { background-position: -420px 210px; } }
.ps-lite .qw-shine { animation: qwShine 7s ease-in-out infinite alternate; }
@keyframes qwShine { from { transform: translateX(-6%); } to { transform: translateX(6%); } }
.ps-lite .qw-patch { animation: qwPatch 16s ease-in-out infinite alternate; }
@keyframes qwPatch { from { transform: translate(-3%, -2%) scale(1); } to { transform: translate(3%, 2%) scale(1.05); } }
.ps-lite .qb-glint { filter: drop-shadow(0 0 4px rgba(255,255,255,.9)); box-shadow: none; }
.ps-lite .mm-halo { opacity: 0; background: radial-gradient(ellipse, rgba(255,226,120,.28), rgba(63,220,114,.12) 45%, transparent 70%); animation: mmHalo 4s ease-in-out infinite alternate; animation-fill-mode: both; }
@keyframes mmHalo { from { opacity: .55; transform: translate(-50%,-50%) scale(.94); } to { opacity: 1; transform: translate(-50%,-50%) scale(1.06); } }
.ps-lite .mm-shine {
  color: transparent;
  background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.95) 48%, rgba(255,255,255,.95) 52%, transparent 62%);
  background-size: 260% 100%;
  -webkit-background-clip: text; background-clip: text;
  animation: mmShine 4.2s ease-in-out infinite; animation-fill-mode: both;
}
@keyframes mmShine { 0% { background-position: 130% 0; } 35%, 100% { background-position: -130% 0; } }
.ps-lite .mm-mote { opacity: 0; animation: mmMote 3.2s ease-out infinite; animation-fill-mode: both; }
@keyframes mmMote { 0% { opacity: 0; transform: translateY(0) scale(.6); } 20% { opacity: .9; } 100% { opacity: 0; transform: translateY(-130px) scale(1.1); } }
.ps-lite .mm-breathe { animation: mmBreathe 2.4s ease-in-out infinite; }
@keyframes mmBreathe { 0%, 100% { box-shadow: 0 5px 0 #0c7a22, 0 10px 18px rgba(0,0,0,.4), 0 0 0 rgba(76,239,106,0); } 50% { box-shadow: 0 5px 0 #0c7a22, 0 10px 18px rgba(0,0,0,.4), 0 0 22px rgba(76,239,106,.65); } }

.ps-lite .gunhit-sga button.absolute:not([data-gloss="off"]) { position: absolute; }
@keyframes pop-in {
  0% { transform: scale(0.6); opacity: 0; }
  70% { transform: scale(1.06); opacity: 1; }
  100% { transform: scale(1); }
}

@keyframes spin { to { transform: rotate(360deg); } }

@keyframes burst {
  0% { transform: translate(-50%,-50%) translate(0,0) scale(.4) rotate(0); opacity: 1; }
  20% { transform: translate(-50%,-50%) translate(calc(var(--dx)*.35), calc(var(--dy)*.35)) scale(1.2) rotate(60deg); opacity: 1; }
  100% { transform: translate(-50%,-50%) translate(var(--dx), var(--dy)) scale(0) rotate(240deg); opacity: 0; }
}
.ps-lite .burst { animation: burst .9s cubic-bezier(.1,.8,.3,1) both; }
@keyframes flash {
  0% { opacity: 0; }
  12% { opacity: .95; }
  100% { opacity: 0; }
}
.ps-lite .flash { animation: flash .7s ease-out both; }

@keyframes twinkle {
  0%,100% { transform: scale(0) rotate(0); opacity: 0; }
  50% { transform: scale(1) rotate(90deg); opacity: 1; }
}
.ps-lite .twinkle { animation: twinkle 1.8s ease-in-out infinite both; }

@keyframes dust {
  0% { transform: translateY(0) translateX(0); opacity: 0; }
  15% { opacity: var(--o); }
  85% { opacity: var(--o); }
  100% { transform: translateY(-760px) translateX(var(--sx)); opacity: 0; }
}
.ps-lite .dust { animation: dust linear infinite both; }

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
.ps-lite .float { animation: float 2.4s ease-in-out infinite; }

@keyframes muzzle {
  0% { transform: scale(.4); opacity: 1; }
  100% { transform: scale(1.6); opacity: 0; }
}
.ps-lite .muzzle { animation: muzzle .18s ease-out both; }
@keyframes spinCenter {
  from { transform: translate(-50%, -50%) rotate(0deg); }
  to { transform: translate(-50%, -50%) rotate(360deg); }
}

@keyframes glarePulse {
  0%, 100% { opacity: 0.88; transform: translate(-50%, -50%) scale(1); }
  50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
}

@keyframes starTwinkleFx {
  0%, 100% { opacity: 0.15; transform: scale(0.6); }
  50% { opacity: 0.95; transform: scale(1.2); }
}

.ps-lite .sunburst-halo {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate3d(-50%, -50%, 0);
  border-radius: 50%;
  pointer-events: none;
  backface-visibility: hidden;
}

.ps-lite .sunburst-rays {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate3d(-50%, -50%, 0);
  pointer-events: none;
  will-change: transform;
  backface-visibility: hidden;
  animation: spinCenter 32s linear infinite;
}

.ps-lite .sunburst-glow {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate3d(-50%, -50%, 0);
  border-radius: 50%;
  pointer-events: none;
  backface-visibility: hidden;
}

.ps-lite .sunburst-hot {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate3d(-50%, -50%, 0);
  border-radius: 50%;
  pointer-events: none;
  will-change: transform, opacity;
  backface-visibility: hidden;
  animation: glarePulse 2.6s ease-in-out infinite;
}

.ps-lite .star-dot-fx {
  position: absolute;
  border-radius: 9999px;
  background: white;
  animation: starTwinkleFx var(--tw, 3s) ease-in-out infinite;
  pointer-events: none;
}
.ps-lite .slide-paused,
.ps-lite .slide-paused *,
.ps-lite .slide-paused *::before,
.ps-lite .slide-paused *::after {
  animation-play-state: paused !important;
}
.ps-lite .font-arsenal-title { font-family: 'Russo One', 'Lilita One', system-ui, sans-serif; }
.ps-lite .arsenal-armory-open, .ps-lite .arsenal-armory-closing { isolation: isolate; }
.ps-lite .arsenal-firefly { opacity: .7; box-shadow: 0 0 7px 2px rgba(190,170,255,.45); animation: arsenalFirefly 6s ease-in-out infinite alternate; }
@keyframes arsenalFirefly { from { transform: translate3d(-5px,4px,0) scale(.75); opacity: .35; } to { transform: translate3d(8px,-12px,0) scale(1.15); opacity: .9; } }
.ps-lite .arsenal-scroll-area { scrollbar-width: thin; scrollbar-color: rgba(192,132,252,.75) rgba(15,8,28,.55); overscroll-behavior: contain; }
.ps-lite .arsenal-scroll-area::-webkit-scrollbar { width: 5px; }
.ps-lite .arsenal-scroll-area::-webkit-scrollbar-track { background: rgba(15,8,28,.55); border-radius: 999px; }
.ps-lite .arsenal-scroll-area::-webkit-scrollbar-thumb { background: linear-gradient(180deg,#e879f9,#7c3aed); border-radius: 999px; }

.ps-lite { font-family: 'Inter', sans-serif; font-weight: 400; color: #fff; background: #10242a; touch-action: manipulation; -webkit-tap-highlight-color: transparent; --font-title: 'Russo One', system-ui, sans-serif; --font-ui: 'Russo One', system-ui, sans-serif; }
.ps-lite .font-title, .ps-lite .font-ui, .ps-lite .font-arsenal-title { font-family: 'Russo One', system-ui, sans-serif; }
.ps-lite .svg-asset > svg { display: block; width: 100%; height: 100%; }
.ps-lite button, .ps-lite canvas[role='button'] { cursor: pointer; }

.ps-lite [data-active='false'] *, .ps-lite[data-active='false'] * { animation-play-state: paused !important; }
